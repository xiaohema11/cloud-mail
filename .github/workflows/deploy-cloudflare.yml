name: Deploy cloud-mail to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: 检出代码仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js / Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖 / Install dependencies
        run: pnpm install

      - name: 禁用 Wrangler 遥测 / Disable wrangler telemetry
        run: pnpm wrangler telemetry disable

      - name: 设置 KV 数据库 / Set up KV database
        run: |
          echo "Setting up KV database..."
          pnpm wrangler kv:namespace create "CLOUDMAIL" --preview || true
          pnpm wrangler kv:namespace create "CLOUDMAIL" || true

      - name: 设置 D1 数据库 / Set up D1 database
        run: |
          echo "Setting up D1 database..."
          pnpm wrangler d1 create cloud-mail-db || true

      - name: 开始部署 / Start deployment
        run: pnpm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN: ${{ secrets.ADMIN }}
          DOMAIN: ${{ secrets.DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: 初始化数据库 / Initialize database
        run: pnpm run init-db || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
